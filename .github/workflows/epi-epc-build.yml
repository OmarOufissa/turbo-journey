name: Build GEPI (EPI/EPC)
on:
  workflow_dispatch:
  push:
    branches: [main, claude/onee-epi-epc-app-k5yqqk]
    tags: ['epi-epc-v*']
    paths: ['epi-epc-app/**']
  pull_request:
    branches: [main]
    paths: ['epi-epc-app/**']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            eb_flag: --win
          - os: macos-latest
            platform: mac
            eb_flag: --mac
          - os: ubuntu-latest
            platform: linux
            eb_flag: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: epi-epc-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app + server
        run: pnpm build
      - name: Package Electron app
        run: pnpm exec electron-builder ${{ matrix.eb_flag }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with: { name: gepi-installer-${{ matrix.platform }}, path: epi-epc-app/dist-electron/, retention-days: 30 }

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/epi-epc-v')
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts/ }
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/**/*, draft: false, generate_release_notes: true }
