<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fiches d'évaluation — version test</title>
<style>
  :root{
    --ink:#1a1d22; --muted:#5b6470; --line:#9aa3ad; --line-soft:#c9d0d8;
    --bg:#eef1f4; --panel:#ffffff; --accent:#1f5aa6; --accent-soft:#e8f0fb;
    --sel:#d9dee4; --ok:#1a7f37; --bad:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Arial, "Helvetica Neue", Helvetica, sans-serif;font-size:14px;line-height:1.45}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:.2em 0}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .controls{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px;margin-bottom:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:12px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  select,input[type=text],input[type=date],input[type=number]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-weight:700;padding:8px 16px;border:0;background:#fff;color:var(--accent);cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .syms{display:flex;flex-wrap:wrap;gap:8px}
  .syms label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;font-weight:700;font-size:13px;background:#fff}
  .syms label.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .syms input{accent-color:var(--accent)}
  .chkline{display:flex;align-items:center;gap:8px;font-size:13px}
  .btnbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .btn{font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn.sec{background:#fff;color:var(--accent)}
  .hint{color:var(--muted);font-size:12px}
  .empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:30px;text-align:center;color:var(--muted)}

  /* ---- Fiche (imprimable) ---- */
  .fiche{background:#fff;color:#000;border:1px solid #000;padding:10mm;margin:0 auto 18px;max-width:210mm;font-size:11px}
  .fiche h2{font-size:13px;text-align:center;margin:6px 0 4px;text-transform:none}
  .entete{display:flex;align-items:center;justify-content:flex-start;border-bottom:1.5px solid #000;padding-bottom:4px;margin-bottom:6px}
  .entete img{height:42px;width:auto}
  .subtitle{text-align:center;font-weight:bold;margin:2px 0 6px;font-size:11px}
  .fields{margin:6px 0;line-height:1.7}
  .fields div{padding:0}
  .phrase{font-weight:bold;margin:7px 0 4px}
  .apprx{border:1px solid #000;padding:6px;margin-top:6px}
  .apprbox{width:100%;border:0;outline:0;resize:vertical;font:inherit;min-height:60px;background:transparent}
  .star{font-size:9.5px;margin-top:4px}
  .fiche .dir{font-weight:bold}
  table.grid{border-collapse:collapse;width:100%;margin:6px 0}
  table.grid th,table.grid td{border:1px solid #000;padding:3px 5px;vertical-align:middle}
  table.grid th{background:#f0f0f0;text-align:center}
  .info td{border:none;padding:2px 4px}
  .legend td{text-align:center;font-weight:bold;width:11%}
  .legend td.lbl{text-align:left;width:24%}
  .sel{background:var(--sel);font-weight:bold}
  .unsel{text-decoration:line-through;color:#333;font-weight:normal}
  .center{text-align:center}
  .res-input{width:52px;text-align:center;border:1px solid #999;border-radius:4px;padding:2px}
  .elim{color:var(--bad);font-weight:bold}
  .calc{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0;font-weight:bold}
  .calc .ok{color:var(--ok)} .calc .bad{color:var(--bad)}
  .appr{border:1px solid #000;padding:6px;min-height:34px;margin-top:6px}
  .appr b{font-weight:bold}
  .notesnb{font-size:9.5px;color:#222;margin-top:4px}
  .tick{width:16px;height:16px;accent-color:#000}
  .fiche input[type=text]{border:0;border-bottom:1px solid #666;border-radius:0;padding:1px 2px;font:inherit;min-width:120px}
  .pgnum{text-align:right;font-size:9px;color:#444;margin-top:4px}

  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .noprint{display:none !important}
    .fiche{border:none;margin:0;padding:8mm 10mm;max-width:none;page-break-after:always}
    .fiche:last-child{page-break-after:auto}
    @page{size:A4 portrait;margin:8mm}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="noprint">
    <h1>Fiches d'évaluation</h1>
    <div class="sub">Habilitations électriques hors tension. Remplir puis <b>Imprimer / Enregistrer en PDF</b> (Ctrl+P).</div>

    <div class="controls">
      <div class="row">
        <div class="fld">
          <label>1. Type d'évaluation</label>
          <div class="seg" id="typeSeg">
            <button data-type="Formation" class="on">Formation</button>
            <button data-type="Examen">Examen</button>
          </div>
        </div>
        <div class="fld" style="flex:1;min-width:240px">
          <label>2. Agent</label>
          <select id="agentSel"></select>
        </div>
        <div class="fld">
          <label>3. a subi le</label>
          <input type="date" id="dateInp"/>
        </div>
      </div>

      <div class="row" id="manualRow" hidden>
        <div class="fld"><label>Nom</label><input type="text" id="m_nom"/></div>
        <div class="fld"><label>Prénom</label><input type="text" id="m_prenom"/></div>
        <div class="fld"><label>Matricule</label><input type="text" id="m_mat"/></div>
        <div class="fld"><label>Division</label><input type="text" id="m_div"/></div>
        <div class="fld"><label>Service</label><input type="text" id="m_srv"/></div>
        <div class="fld"><label>Fonction</label><input type="text" id="m_fonc"/></div>
        <div class="fld"><label>Équipe</label><input type="text" id="m_eq"/></div>
      </div>

      <div class="row">
        <div class="fld" style="flex:1">
          <label>4. Symboles d'habilitation (sélection multiple)</label>
          <div class="syms" id="symBox"></div>
        </div>
      </div>

      <div class="row">
        <label class="chkline"><input type="checkbox" id="maintChk"/> Agent des <b>&nbsp;équipes maintenance des postes</b>&nbsp; (barème /120 · sinon /80)</label>
      </div>

      <div class="btnbar">
        <button class="btn" id="printBtn">Imprimer / Enregistrer en PDF</button>
        <span class="hint" id="ctxHint"></span>
      </div>
    </div>
  </div>

  <div id="fiches"></div>
</div>

function todayISO(){ const d=new Date(); const o=d.getTimezoneOffset(); return new Date(d-o*60000).toISOString().slice(0,10); }

const agentSel=document.getElementById("agentSel");
DEMO_AGENTS.forEach((a,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=`${a.matricule} — ${a.nom} ${a.prenom} · ${a.division}`; agentSel.appendChild(o); });

const symBox=document.getElementById("symBox");
SYMBOLS.forEach(s=>{
  const lab=document.createElement("label"); lab.dataset.sym=s;
  lab.innerHTML=`<input type="checkbox" value="${s}"> ${s}`;
  const cb=lab.querySelector("input"); cb.checked=state.selected.has(s);
  lab.classList.toggle("on",cb.checked);
  cb.addEventListener("change",()=>{ cb.checked?state.selected.add(s):state.selected.delete(s); lab.classList.toggle("on",cb.checked); render(); });
  symBox.appendChild(lab);
});

document.getElementById("typeSeg").addEventListener("click",e=>{

  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));

});

  if(agentSel.value==="manual") return {
    nom:val("m_nom"),prenom:val("m_prenom"),matricule:val("m_mat"),

}
function val(id){return document.getElementById(id).value.trim();}

/* ---------------- Rendu ---------------- */
function activeContexts(){
  const list=[];
  [1,2].forEach(id=>{ if(CTX[id].symbols.some(s=>state.selected.has(s))) list.push(CTX[id]); });
  return list;
}

function legendTable(ctx){
  const rows=ctx.legend.map(r=>{
    const cells=r.map(sym=>{
      const cls = state.selected.has(sym) ? "sel" : "unsel";
      return `<td class="legend ${cls}">${sym}</td>`;
    }).join("");
    return `<tr><td class="legend lbl">Habilitations(1)</td>${cells}</tr>`;
  }).join("");
  return `<table class="grid">${rows}</table>`;
}

}

/* ---- Formation ---- */
function formationFiche(ctx){
  const a=currentAgent();
  const applic = MATIERES.filter(m=>state.maint || !m.maintOnly);
  const sumCoef = applic.reduce((s,m)=>s+m.coef,0);
  const maxTotal = sumCoef*20;
  const key="form"+ctx.id; results[key]=results[key]||{};
  let total=0, eliminated=false, allFilled=true;
  const bodyRows = MATIERES.map(m=>{
    const disabled = m.maintOnly && !state.maint;
    const note = results[key][m.key];
    if(!disabled){
      if(note===undefined||note===""){ allFilled=false; }
      else { total += Number(note)*m.coef; if(Number(note) < ctx.elim[m.key]) eliminated=true; }
    }
    const elimTxt = "&lt;"+ctx.elim[m.key]+"/20";
    const inp = disabled
      ? `<span style="color:#999">— (maintenance postes uniquement)</span>`
      : `<input type="number" min="0" max="20" step="0.5" class="res-input" data-k="${key}" data-m="${m.key}" value="${note!==undefined?note:''}">`;
    const bad = (!disabled && note!==undefined && note!=="" && Number(note)<ctx.elim[m.key]) ? ' class="elim"' : '';
    return `<tr><td>${m.label}</td><td class="center">${elimTxt}</td><td class="center">${m.coef}</td><td class="center"${bad}>${inp}</td></tr>`;
  }).join("");

  const seuil = state.maint ? ctx.seuil.maint : ctx.seuil.autre;
  const moy = sumCoef? (total/sumCoef):0;
  const pass = allFilled && !eliminated && total>=seuil.total && moy>=seuil.moy;
  const showCalc = (Object.keys(results[key]).length>0);
  const calc = showCalc ? `<div class="calc">
      <span>Total : <span class="${total>=seuil.total?'ok':'bad'}">${total.toFixed(1)} / ${maxTotal}</span> (seuil ≥ ${seuil.total})</span>
      <span>Moyenne : <span class="${moy>=seuil.moy?'ok':'bad'}">${moy.toFixed(2)} / 20</span> (seuil ≥ ${seuil.moy})</span>
      ${eliminated?'<span class="bad">⚠ Note éliminatoire</span>':''}
      <span>${pass?'<span class="ok">RÉUSSI</span>':(allFilled?'<span class="bad">NON RÉUSSI</span>':'<span style="color:#777">— en attente de saisie —</span>')}</span>
    </div>` : '';

  const appr = pass ? `<b>${APPRE_OK}</b>` : '';

  return `<section class="fiche">
    ${entete()}
    <h2>${ctx.formTitle}</h2>
    <div class="subtitle" style="text-align:left">Concernant l'examen (contrôle)* d'obtention des habilitations hors tension</div>
    <div class="fields">
      <div><b>L'agent :</b> ${esc(a.nom)} ${esc(a.prenom)} &nbsp;&nbsp;&nbsp; <b>Mle :</b> ${esc(a.matricule)}</div>
      <div><b>Entité d'affectation :</b> ${esc(entite(a))}</div>
      <div><b>Fonction :</b> ${esc(a.fonction)}</div>
      <div><b>a subi le :</b> ${fmtDate(state.date)} &nbsp;&nbsp; un examen (contrôle)* d'obtention des habilitations suivantes :</div>
    </div>
    ${legendTable(ctx)}
    <div class="phrase">et a obtenu les notes ci-après :</div>
    <table class="grid">
      <tr><th style="text-align:left">Matières</th><th>Notes éliminatoires / 20</th><th>Coefficients</th><th>Résultats</th></tr>
      ${bodyRows}
    </table>
    ${calc}
    <div class="appr"><b>Appréciation globale :</b> ${appr}</div>
    <div class="notesnb">
      (1) : Barrer la mention inutile<br>
      * : Les modules « Code de manœuvres » et « Repérage alphabétique » concernent uniquement les agents des équipes maintenance des postes.<br>
      ** : Une erreur sur l'épreuve « manœuvres sur schémas » (mauvaise consignation, fausse manœuvre, etc.) constitue une note éliminatoire.<br>
      Seuils — Agents équipes maintenance des postes : total ≥ ${ctx.seuil.maint.total}/120, moyenne ≥ ${ctx.seuil.maint.moy}/20.
      Autres : total ≥ ${ctx.seuil.autre.total}/80, moyenne ≥ ${ctx.seuil.autre.moy}/20.
    </div>
    <table class="grid" style="margin-top:8px">
      <tr><th colspan="4">Formateurs</th></tr>
      <tr><th>Fonction</th><th>Prénom et NOM</th><th>Matricule</th><th>Visa et Date</th></tr>
      ${'<tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>'.repeat(3)}
    </table>
  </section>`;
}

/* ---- Examen ---- */
function examCell(key,idx,level,current){
  const checked = current===level ? 'checked' : '';
  const cls = current===level ? 'sel' : '';
  return `<td class="center ${cls}"><input type="checkbox" class="tick" data-exk="${key}" data-i="${idx}" data-lvl="${level}" ${checked}></td>`;
}
function examenFiche(ctx){
  const a=currentAgent();
  const key="exam"+ctx.id; results[key]=results[key]||{};
  let disciplines;
  if(ctx.id===1){ disciplines = ctx.examMin.map(x=>({label:x[0],min:x[1]})); }
  else{
    disciplines = ctx.examGeneral.map(x=>({label:x[0],min:x[1]}));
    if(state.selected.has("BR")) disciplines = disciplines.concat(ctx.examBR.map(x=>({label:x[0]+" (BR)",min:x[1]})));
    disciplines.push({label:ctx.examComport[0],min:ctx.examComport[1]});
  }
  const rows = disciplines.map((d,idx)=>{
    const cur = results[key][idx];
    const cells = LEVELS.map(l=>examCell(key,idx,l,cur)).join("");
    return `<tr><td style="text-align:left">${esc(d.label)}</td>${cells}<td class="center"><b>${d.min}</b></td></tr>`;
  }).join("");
  return `<section class="fiche">
    ${entete()}
    <h2>${ctx.examTitle}</h2>
    <div class="fields">
      <div><b>Direction :</b> ${esc(DIRECTION)}</div>
      <div><b>Division :</b> ${esc(a.division)}</div>
      <div><b>Entité d'affectation :</b> ${esc(entite(a))}</div>
      <div><b>Nom :</b> ${esc(a.nom)}</div>
      <div><b>Prénom :</b> ${esc(a.prenom)}</div>
      <div><b>Matricule :</b> ${esc(a.matricule)}</div>
      <div><b>Fonction :</b> ${esc(a.fonction)}</div>
      <div><b>Examen du :</b> ${fmtDate(state.date)}</div>
    </div>
    <div class="phrase">${ctx.examPhrase}</div>
    ${legendTable(ctx)}
    <table class="grid">
      <tr><th style="text-align:left" rowspan="2">Appréciation / Disciplines</th><th colspan="4">Résultat</th><th rowspan="2">Appréciation minimale de réussite</th></tr>
      <tr>${LEVELS.map(l=>`<th>${l}</th>`).join("")}</tr>
      ${rows}
    </table>
    <div class="apprx">
      <div><b>Appréciation globale *</b></div>
      <textarea class="apprbox" rows="4" placeholder="…"></textarea>
      <div class="star">(*) sous réserve d'un encadrement pendant les 6 premiers mois de l'exercice de son habilitation</div>
    </div>
    <div class="notesnb">(1) : Barrer la mention inutile</div>
    <table class="grid" style="margin-top:8px">
      <tr><th colspan="4">Membres de la Commission d'examen d'habilitation hors tension et BR</th></tr>
      <tr><th>Fonction</th><th>Prénom et NOM</th><th>Matricule</th><th>Date, cachet et signature</th></tr>
      ${'<tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>'.repeat(3)}
    </table>
  </section>`;
}

function render(){
  const ctxs=activeContexts();
  const host=document.getElementById("fiches");
  const hint=document.getElementById("ctxHint");
  if(ctxs.length===0){
    host.innerHTML=`<div class="empty noprint">Sélectionnez au moins un symbole d'habilitation pour générer la fiche.</div>`;
    hint.textContent=""; return;
  }
  hint.textContent = ctxs.length===1 ? "→ 1 contexte · 1 page" : "→ 2 contextes · 2 pages";
  host.innerHTML = ctxs.map(c=> state.type==="Formation" ? formationFiche(c) : examenFiche(c)).join("");

  // wire result inputs
  host.querySelectorAll("input.res-input").forEach(inp=>{
    inp.addEventListener("input",()=>{ (results[inp.dataset.k]=results[inp.dataset.k]||{})[inp.dataset.m]=inp.value; renderKeepFocus(inp); });
  });
  host.querySelectorAll("input.tick").forEach(cb=>{
    cb.addEventListener("change",()=>{ const k=cb.dataset.exk,i=cb.dataset.i; results[k]=results[k]||{}; results[k][i]= cb.checked?cb.dataset.lvl:undefined; render(); });
  });
}
// re-render for formation totals without losing the field the user types in
function renderKeepFocus(activeInp){
  const k=activeInp.dataset.k, m=activeInp.dataset.m, pos=activeInp.selectionStart;
  render();
  const again=document.querySelector(`input.res-input[data-k="${k}"][data-m="${m}"]`);
  if(again){ again.focus(); try{again.setSelectionRange(pos,pos);}catch(e){} }
}

render();
</script>
</body>
</html>
